# P10 在线 demo 部署 — GitHub Pages + adapter-static + 浏览器内 WASM 引擎(零网络依赖)
# stage1-m4:在线 demo 默认 WasmBackend(打开 URL 即进 WASM 模式,无需 ?backend=wasm)。
#
# 触发:push 到 main 分支(src/ 或 package.json 变更时)
# 产物:SvelteKit adapter-static build → GitHub Pages 公网可访问
# URL:https://evorule.github.io/evorule-console-cloud/
#
# 默认 backend 经 VITE_DEFAULT_BACKEND=wasm 在构建期注入客户端 bundle;
# 仍可用 ?backend=wasm|http|mock / ?mock=1 手动覆盖。
# Service Worker(static/service-worker.js)在生产构建自动注册,支持离线打开。

name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "static/**"
      - "package.json"
      - "package-lock.json"
      - "svelte.config.js"
      - "vite.config.ts"
      - ".github/workflows/deploy-demo.yml"
  # 允许手动触发
  workflow_dispatch:

# GitHub Pages 部署权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build demo (adapter-static)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages base path
        # GitHub Pages 部署在 /evorule-console-cloud/ 子路径下
        # 通过环境变量传给 svelte.config.js(动态 base)
        run: |
          echo "GITHUB_PAGES=true" >> $GITHUB_ENV

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npx vitest run --reporter=verbose

      - name: Build (adapter-static)
        run: npm run build
        env:
          # adapter-static 预渲染:demo 模式不依赖后端,可全量预渲染
          GITHUB_PAGES: "true"
          # 在线 demo 默认 WASM 模式(注入客户端 bundle,无需 ?backend=wasm)
          VITE_DEFAULT_BACKEND: "wasm"

      - name: SPA fallback (404.html)
        # adapter-static 的 fallback 生成的是 index.html;GitHub Pages 用 404.html
        # 兜底未匹配路径,复制一份使深链接(如 /evorule-console-cloud/rules)回到 SPA。
        run: cp build/index.html build/404.html

      - name: Verify demo artifacts
        run: |
          test -f build/index.html
          test -f build/404.html
          test -f build/service-worker.js
          test -n "$(find build -name '*.wasm' | head -n 1)"
          test -f build/rules/core_eval.json
          echo "demo artifacts OK"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
