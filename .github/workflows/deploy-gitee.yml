#
# Gitee Pages 部署 —— Gitee 不支持 GitHub Actions,故由 GitHub Actions 构建后
# 把 build/ 推送到 Gitee 仓库的 `pages` 分支根目录,Gitee Pages 从该分支发布。
#
# 前置一次性配置(详见 74-双平台部署与离线缓存配置说明.md):
#   1. Gitee 生成私人令牌(Personal Access Token,勾选 projects 权限)。
#   2. 在 GitHub 仓库 Settings → Secrets and variables → Actions 新建:
#        GITEE_TOKEN = <Gitee 私人令牌>
#   3. Gitee 仓库 → 服务 → Gitee Pages,选择分支 `pages` 启用。
#
# 与 GitHub Pages 共用同一套 base path:GITHUB_PAGES=true → base=/evorule-console-cloud,
# 对应 https://<user>.gitee.io/evorule-console-cloud/。

name: Deploy Demo to Gitee Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "static/**"
      - "package.json"
      - "package-lock.json"
      - "svelte.config.js"
      - "vite.config.ts"
      - ".github/workflows/deploy-gitee.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "gitee-pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & push to Gitee pages branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build (adapter-static)
        run: npm run build
        env:
          # Gitee Pages 同样在 /evorule-console-cloud/ 子路径下,复用 GitHub base path
          GITHUB_PAGES: "true"
          VITE_DEFAULT_BACKEND: "wasm"

      - name: SPA fallback (404.html)
        # Gitee Pages 无自定义 SPA rewrite,404.html 作为未匹配路径回退外壳
        run: cp build/index.html build/404.html

      - name: Verify demo artifacts
        run: |
          test -f build/index.html
          test -f build/404.html
          test -f build/service-worker.js
          test -n "$(find build -name '*.wasm' | head -n 1)"
          test -f build/rules/core_eval.json
          echo "demo artifacts OK"

      - name: Push build/ to Gitee pages branch
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::缺少 GitHub Secret GITEE_TOKEN(见文件头注释配置)"
            exit 1
          fi
          cd build
          git init -b pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push --force \
            "https://x-access-token:${GITEE_TOKEN}@gitee.com/evorule/evorule-console-cloud.git" \
            HEAD:pages
