name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 修复: mirror.yml 经 GITHUB_TOKEN 推送不触发 workflow (GitHub 防递归),
  # 镜像后 CI 永不自动运行——补手动触发器, 由本地 PAT dispatch 或人工触发补跑
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (svelte-check)
        run: npm run check

      - name: Unit tests (vitest)
        run: npx vitest run

      - name: Production build (adapter-static)
        run: npm run build

      - name: Public-surface scan (internal ids zero tolerance)
        run: |
          if grep -rnE "UV-[0-9]+|CR-[0-9]+|AUDIT-[0-9]+|INC-[0-9]+" \
              --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=build . ; then
            echo "::error::Internal identifier found in public surface"
            exit 1
          fi

  # ==========================================================================
  # public-face-scan：公开面矩阵扫描 (与主仓 CI 同型)。
  # 词表五类: AI 身份 / 厂商名 / 内部批次编号 / 私有路径仓名 / 治理语境。
  # 本 job 对 A1(AI 身份) 与 B(内部编号) 计入退出码即红; C/D 类复核项不阻断。
  # ==========================================================================
  public-face-scan:
    name: public face scan (A1/B blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 公开面矩阵扫描 (AI 身份 + 内部编号阻断)
        run: python3 scripts/scan_public_face.py --fail-on A1 --fail-on B

  # ==========================================================================
  # e2e：Playwright 全套(80 用例,mock 模式零外部依赖)。
  # 生产口径:PR 必跑必绿——UI 真实浏览器行为是发布门,不做可选档。
  # ==========================================================================
  e2e:
    name: E2E (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        run: npx playwright test
        env:
          CI: 'true'
          # 套件缺省 mock 后端:整套 spec 自包含零外部依赖(干净 CI 无
          # evorule-server;本地 dev 代理+常驻实例的隐性依赖由此消除)。
          # 需要 http 态的用例(如不可达诚实性)显式 ?backend=http 选择。
          VITE_DEFAULT_BACKEND: mock

  # Ecosystem license gate (reusable workflow, pinned to root-repo commit)
  license-gate:
    name: license gate
    permissions:
      contents: read
    uses: evorule/evorule/.github/workflows/license-gate.yml@9d0e4fdbb28cfd0db1051c9014149f198b290e6b

